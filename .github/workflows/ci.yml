name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eca
          POSTGRES_PASSWORD: eca
          POSTGRES_DB: eca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://eca:eca@localhost:5432/eca
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      # Replays the recorded responses in evals/cache: no API key, no quota. A prompt or
      # model change without a fresh live run fails here on the cache miss.
      - name: Claim extraction eval
        run: uv run python -m evals.run --offline --min-precision 0.65 --min-recall 0.55 --min-grounding 0.95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
