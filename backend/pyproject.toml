[project]
name = "eca-backend"
version = "0.1.0"
description = "Earnings Call Analyst backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "lxml>=6.1.3",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "whisper-normalizer>=0.1.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real provider APIs and spends quota (run with -m live)"]
addopts = "-m 'not live'"
